version: '3.8'

services:
  cold-email-generator:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: cold-email-generator
    ports:
      - "8501:8501"
    environment:
      - API_KEY=${API_KEY}
      - LLM_MODEL=${LLM_MODEL:-llama-3.1-8b-instant}
      - LLM_TEMPERATURE=${LLM_TEMPERATURE:-0}
      - USER_NAME=${USER_NAME:-Student}
      - UNIVERSITY=${UNIVERSITY:-University}
      - YEAR=${YEAR:-4th year}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
    env_file:
      - .env
    volumes:
      - ./logs:/app/logs
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8501/_stcore/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
